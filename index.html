<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Budget Tracker</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">
    <h1>Budget Tracker</h1>

    <div class="summary">
      <div class="summary-card balance">
        <span class="label">Balance</span>
        <span class="amount" id="balance">$0.00</span>
      </div>
      <div class="summary-card income">
        <span class="label">Income</span>
        <span class="amount" id="total-income">$0.00</span>
      </div>
      <div class="summary-card expense">
        <span class="label">Expenses</span>
        <span class="amount" id="total-expenses">$0.00</span>
      </div>
    </div>

    <div class="add-transaction">
      <h2>Add Transaction</h2>
      <form id="transaction-form">
        <div class="form-group">
          <label for="description">Description</label>
          <input type="text" id="description" placeholder="e.g. Rent, Salary..." required />
        </div>
        <div class="form-group">
          <label for="amount">Amount</label>
          <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required />
        </div>
        <div class="form-group">
          <label for="type">Type</label>
          <select id="type">
            <option value="income">Income</option>
            <option value="expense">Expense</option>
          </select>
        </div>
        <div class="form-group">
          <label for="category">Category</label>
          <select id="category">
            <option value="general">General</option>
            <option value="food">Food</option>
            <option value="housing">Housing</option>
            <option value="transport">Transport</option>
            <option value="entertainment">Entertainment</option>
            <option value="health">Health</option>
            <option value="salary">Salary</option>
            <option value="other">Other</option>
          </select>
        </div>
        <button type="submit" class="btn-add">Add Transaction</button>
      </form>
    </div>

    <div class="history">
      <div class="history-header">
        <h2>Transaction History</h2>
        <button class="btn-clear" id="clear-all">Clear All</button>
      </div>
      <ul id="transaction-list">
        <li class="empty-state">No transactions yet. Add one above!</li>
      </ul>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
